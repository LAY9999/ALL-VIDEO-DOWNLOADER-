
workflows:
  android-workflow:
    name: ALL VIDEO DOWNLOADER APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create --platforms=android,web .

      - name: Add Internet Permission
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Application tag not found")

              content = content.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

              manifest.write_text(content)

          print("Internet Permission added successfully")
          PY

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  web-workflow:
    name: ALL VIDEO DOWNLOADER WEB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create --platforms=android,web .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Website
        script: |
          flutter build web --release

    artifacts:
      - build/web/**
      
